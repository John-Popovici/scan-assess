[storage]
root = "./logs"
flush_interval_ms = 1000
retention_days = 90
format = "json"

[capture]
interface = "auto"
capture_udp_53 = true
capture_tcp_53 = true
log_queries = true
log_responses = false

[agent]
mode = "single"
max_queue_events = 10000
drop_when_full = true
health_interval_seconds = 60

[client]
# Use an IP address or a resolvable LAN hostname.
# Examples:
# collector_addr = "192.168.1.10:53530"
# collector_addr = "dnslog-host.local:53530"
collector_addr = "dnslog-host.local:53530"
shared_token = "generate-a-fresh-32-byte-random-token"
source_id = "auto"
forward_queue_events = 10000

[collector]
listen_addr = "0.0.0.0:53530"
shared_token = "generate-a-fresh-32-byte-random-token"
allowed_subnets = []
max_remote_queue_events = 10000
max_clients = 128
max_frame_bytes = 1048576
read_timeout_seconds = 30

[storage]
root = "./logs-host-test"
flush_interval_ms = 1000
retention_days = 90

[capture]
interface = "bridge100"
capture_udp_53 = true
capture_tcp_53 = true
log_queries = true
log_responses = false

[agent]
mode = "host"
max_queue_events = 10000
drop_when_full = true
health_interval_seconds = 10

[client]

shared_token = "PuTYCjXMReptkPBH75mSfUAO8QOFhXUW6jbUXa/Zm9I="
source_id = "auto"
forward_queue_events = 10000

[collector]
listen_addr = "0.0.0.0:53530"
shared_token = "PuTYCjXMReptkPBH75mSfUAO8QOFhXUW6jbUXa/Zm9I="
allowed_subnets = ["10.211.55.0/24"]

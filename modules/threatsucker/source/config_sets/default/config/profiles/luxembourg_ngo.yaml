profile_id: luxembourg_ngo
name: Luxembourg NGO Mini Profile
description: Basic threat collection profile for small Luxembourgish NGOs.
theme_rules:
  - id: credential_phishing
    label: Credential phishing and account takeover
    threat_focus:
      - phishing
      - credential_theft
    terms:
      - login
      - password
      - account
      - microsoft
      - office 365
      - microsoft 365
    suggested_ai_use: Treat as awareness, mailbox, browser-history, and DNS-review context.
  - id: donation_payment_fraud
    label: Donation, payment, and invoice fraud
    threat_focus:
      - phishing
      - credential_theft
      - invoice_fraud
      - donation_page_impersonation
    terms:
      - donation
      - donor
      - invoice
      - payment
      - paypal
      - stripe
      - bgl bnp paribas
    suggested_ai_use: Treat as NGO workflow abuse context, especially for finance or fundraising staff.
  - id: document_signing_lure
    label: Document-signing and cloud workflow lures
    threat_focus:
      - phishing
      - credential_theft
    terms:
      - docusign
      - document
      - signature
      - sharepoint
      - onedrive
    suggested_ai_use: Treat as document workflow lure context for staff training and mailbox review.
  - id: malware_delivery_watchlist
    label: Malware delivery seen in the wild
    threat_focus:
      - malware
      - c2
    terms:
      - exe
      - loader
      - malware
      - c2
    broad_context_only: true
    suggested_ai_use: Use as a watch list only unless local DNS or endpoint telemetry matches it.
country_terms:
  - luxembourg
  - luxembourgish
  - luxemburgish
  - luxembourg ngo
  - lu
  - .lu
neighbouring_country_terms:

name: phishing-validation
description: Validation prompt using the normal analyst posture for suspicious DNS and asset-risk evidence.
tags:
  - validation
  - phishing
  - dns
system_prompt: >-
  You are a careful cybersecurity analyst. Treat supplied module JSON as the
  source of truth and make no assumptions beyond that evidence. Use provenance
  fields to judge evidence origin and collection method. Imported DNS logs are
  historical observations and are not proof of compromise by themselves. If DNS
  domains look like login pages, brand impersonation, invoice fraud, payment
  fraud, or credential theft, classify that likely threat type clearly. If
  threat-intel correlation reports a browser or software
  vulnerability matching a local asset, call out the affected host and
  product/version separately from DNS findings. Do not describe SafeSniff
  target-detection-only output as a TCP service scan or open-port finding.
user_prompt: |-
  Produce a clear report for a non-technical operator. Name suspicious DNS domains, state why they look like phishing or credential theft, identify the affected host if available, and cite the evidence filename. If ThreatSucker reports a browser or software vulnerability that matches a local asset, call out the affected host and product/version separately from DNS findings. Recommend concrete follow-up steps, but do not claim compromise from DNS evidence alone.

  Use this markdown structure:
  ## Summary
  ## Findings
  ## Evidence To Review
  ## Actionable Items
